[project]
name = "scrapping"
version = "0.1.0"
description = "Script de scraping para extraer precios de Rakuten y actualizar archivos Excel"
authors = [{name = "j.perezurrutia"}]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pandas-stubs (>=3.0.5.260730,<4.0.0.0)",
    "types-requests (>=2.33.0.20260712,<3.0.0.0)",
    "types-beautifulsoup4 (>=4.12.0.20250516,<5.0.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "types-openpyxl (>=3.1.5.20260827,<4.0.0.0)"
]
